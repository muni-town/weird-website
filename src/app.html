<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Roomy</title>
    <meta name="description" content="A way to be on the web!" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--preload font files-->
    <link
      rel="preload"
      href="/fonts/hanken-grotesk/HankenGrotesk-Black.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/hanken-grotesk/HankenGrotesk-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/hanken-grotesk/HankenGrotesk-SemiBold.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/hanken-grotesk/HankenGrotesk-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/hanken-grotesk/HankenGrotesk-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />

    <!--preload images-->
    <link rel="preload" href="/stars.svg" as="image" type="image/avg+xml" />
    <link rel="preload" href="/hero.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/keyboard.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/Screen.svg" as="image" type="image/svg+xml" />
    <link
      rel="preload"
      href="/magic-hand.svg"
      as="image"
      type="image/svg+xml"
    />

    <style>
      /* inline critical css */
      :root {
        --border-radius: 8px;
      }

      /* Hanken Grotesk */
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/fonts/hanken-grotesk/HankenGrotesk-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/fonts/hanken-grotesk/HankenGrotesk-Medium.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/fonts/hanken-grotesk/HankenGrotesk-SemiBold.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/fonts/hanken-grotesk/HankenGrotesk-Black.woff2") format("woff2");
        font-weight: 900;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "Hanken Grotesk";
        src: url("/fonts/hanken-grotesk/HankenGrotesk-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        line-height: 1;
        scrollbar-width: thin;

        ul {
          list-style: none;
        }
      }

      body {
        font-family: "Hanken Grotesk", system-ui, sans-serif;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: "Hanken Grotesk", system-ui, sans-serif;
      }

      .container {
        padding: 3.5em 8.5vw;
      }

      @media (max-width: 768px) {
        .container {
          padding: 3.5em 4vw;
        }
      }

      html {
        font-size: 62.5%;
      }

      p {
        font-size: 1.6rem;
        line-height: 1.6;
      }

      img {
        max-width: 100%;
        height: auto;
      }
    </style>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
